<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Telegram Messenger</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="page">

        <header class="topbar">

            <div class="logo">✈</div>

            <span>Telegram Messenger</span>

        </header>

        <section class="hero">

            <div class="telegram-icon">✈</div>

            <h1>Send Messages<br>Instantly.</h1>

            <p>

                Connect with Telegram through our

                simple and secure messaging platform.

            </p>

            <div class="message-card">

                <h2>Send a Message</h2>

                <p class="subtitle">

                    Write your message below.

                </p>

                <form id="messageForm">

                    <label for="message">Your message</label>

                    <textarea

                        id="message"

                        placeholder="Type your message here..."

                        required

                    ></textarea>

                    <button type="submit" id="sendButton">

                        <span>Send Message</span>

                        <span>➤</span>

                    </button>

                </form>

                <p id="status"></p>

                <div class="secure-note">

                    🔒 Secure Telegram connection

                </div>

            </div>

        </section>

        <footer>

            © 2026 Telegram Messenger. All rights reserved.

        </footer>

    </main>

    <script src="script.js"></script>

</body>

</html>
